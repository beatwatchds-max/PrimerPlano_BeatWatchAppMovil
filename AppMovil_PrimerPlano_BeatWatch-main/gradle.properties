# Configuración general de Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Evita bloqueos de archivos en Windows por el file-watcher del daemon
# (causa frecuente de "Unable to delete directory" al recompilar)
org.gradle.vfs.watch=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Gradle usa el JDK configurado en Android Studio o JAVA_HOME.
# Este proyecto requiere JDK 17.
