// Top-level build file: aquí solo se declaran los plugins y sus versiones.
plugins {
    id 'com.android.application' version '9.3.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
}

// SOLUCIÓN PERMANENTE: redirigir la salida de build FUERA de OneDrive.
// OneDrive bloquea archivos mientras sincroniza y provoca el error
// "Unable to delete directory ...\app\build\intermediates\..." (AccessDenied).
// Los APKs quedarán en: %LOCALAPPDATA%\gradle-builds\BEATWATCH\app\build\outputs\apk\
def localAppData = System.getenv('LOCALAPPDATA')
if (localAppData != null) {
    subprojects {
        layout.buildDirectory.set(
            new File(localAppData, "gradle-builds/BEATWATCH/${project.name}")
        )
    }
}
